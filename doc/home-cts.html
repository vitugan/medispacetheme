<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&family=Poppins%3Awght%40600&display=swap"
      rel="stylesheet"
    />

    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body style="background-color: #08202cff">
    <div
      data-pencil-name="Call to Action V11"
      style="align-items: center; background-color: #08202cff; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; height: fit-content; justify-content: flex-start; padding: 60px 0px; width: 1920px"
    >
      <div
        data-pencil-name="Content"
        style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 16px; height: fit-content; justify-content: flex-start; width: 534px"
      >
        <div
          data-pencil-name="Title"
          style="box-sizing: border-box; color: #ffffffff; display: flex; flex-direction: column; flex-shrink: 0; font-family: Poppins, system-ui, sans-serif; font-size: 36px; font-style: normal; font-weight: 600; height: 32px; justify-content: center; letter-spacing: 0px; line-height: 43px; text-align: center; width: 100%"
        >
          Not sure where to start?
        </div>
        <div
          data-pencil-name="Description"
          style="box-sizing: border-box; color: #ffffffff; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 500; letter-spacing: 0px; line-height: 24px; text-align: center; width: 100%"
        >
          Reach out to us!
        </div>
      </div>
      <div
        data-pencil-name="Button Primary"
        style="align-items: center; background-color: #0385cbff; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 10px; height: 56px; justify-content: center; padding: 12px 24px; width: fit-content"
      >
        <div
          data-pencil-name="CTA"
          style="box-sizing: border-box; color: #ffffffff; font-family: Poppins, system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: 21px; text-align: center; white-space: nowrap"
        >
          Contact us
        </div>
      </div>
    </div>
  </body>
</html>
